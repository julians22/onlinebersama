name: Deploy Laravel to OnlineBersama

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step ini wajib agar GitHub bisa memproses file Laravel Anda sebelum dikirim
      - name: Setup PHP (at GitHub side)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Install Composer Dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Compile Assets (Vite)
        run: |
          npm install
          npm run build
          rm -rf node_modules # Hapus agar tidak memenuhi storage server yang kecil

      - name: Deploy to Server via SSH
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.SERVER_IP }}
          REMOTE_USER: ${{ secrets.SERVER_USER }}
          TARGET: "/home/designcube3/demo_projects/onlinebersama"
          ARGS: "-avz --delete"
          EXCLUDE: "/.git/, /.github/, /tests/, /node_modules/, /storage/logs/"

      - name: Finalize Deployment (Remote Commands)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/designcube3/demo_projects/onlinebersama
            # Menggunakan alias pphp84 sesuai konfigurasi server Anda
            pphp84 artisan down
            pphp84 artisan migrate --force
            pphp84 artisan config:cache
            pphp84 artisan route:cache
            pphp84 artisan view:cache
            pphp84 artisan up
